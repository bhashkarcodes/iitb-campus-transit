<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IITB Transit — Live Campus Vehicle Prototype</title>

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
      integrity="sha512-h9FcoyWjHcOcmEVkxOfTLnmZFWIH0iZhZT1H2TbOq55xssQGEJHEaIm+PgoUaZbRvQTNTluNOEfb1ZRy6D3BOw=="
      crossorigin="anonymous" referrerpolicy="no-referrer">

<style>
/* ============================================================
   IITB Transit — prototype styles
   ============================================================ */
:root{
  --auto:#f0871f;          /* auto-rickshaw brand colour */
  --buggy:#12a150;         /* electric buggy brand colour */
  --route:#1f6feb;         /* primary route */
  --route-alt:#8b94a3;     /* alternative route */
  --ink:#0d1117;
  --ink-2:#424a55;
  --ink-3:#737c89;
  --line:#dfe3ea;
  --glass:rgba(255,255,255,.78);
  --glass-edge:rgba(255,255,255,.55);
  --shadow:0 2px 6px rgba(13,17,23,.08), 0 18px 44px -18px rgba(13,17,23,.38);
  --ok:#12a150; --warn:#d98b00; --bad:#d13b3b;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:14px; color:var(--ink); background:#e8eaed; overflow:hidden;
}
#map{position:absolute; inset:0; z-index:1}

/* ---------- floating panel ---------- */
.panel{
  position:absolute; z-index:1000; top:16px; left:16px; width:340px;
  max-height:calc(100% - 32px); display:flex; flex-direction:column;
  background:var(--glass); backdrop-filter:blur(16px) saturate(165%);
  -webkit-backdrop-filter:blur(16px) saturate(165%);
  border:1px solid var(--glass-edge); border-radius:16px; box-shadow:var(--shadow);
  overflow:hidden;
}
.panel-head{padding:16px 18px 13px; border-bottom:1px solid rgba(13,17,23,.07)}
.brand{display:flex; align-items:center; gap:9px}
.brand-dot{width:9px; height:9px; border-radius:50%; background:var(--ok);
  box-shadow:0 0 0 4px rgba(18,161,80,.18); animation:blip 2.4s ease-in-out infinite}
@keyframes blip{0%,100%{opacity:1}50%{opacity:.45}}
.brand h1{margin:0; font-size:15.5px; font-weight:650; letter-spacing:-.01em}
.brand small{display:block; font-size:11.5px; color:var(--ink-3); font-weight:450; margin-top:1px}
.panel-body{padding:14px 18px 18px; overflow-y:auto; overscroll-behavior:contain}

.lbl{display:block; font-size:11px; font-weight:600; letter-spacing:.045em;
  text-transform:uppercase; color:var(--ink-3); margin:0 0 5px}
.field{display:flex; gap:6px; margin-bottom:11px}
select{
  flex:1; min-width:0; padding:9px 10px; font:inherit; font-size:13.5px; color:var(--ink);
  background:rgba(255,255,255,.92); border:1px solid var(--line); border-radius:9px;
  appearance:none; cursor:pointer;
}
select:focus-visible, button:focus-visible, input:focus-visible{
  outline:2px solid var(--route); outline-offset:2px}
.pick{
  flex:none; width:36px; border:1px solid var(--line); border-radius:9px; cursor:pointer;
  background:rgba(255,255,255,.92); color:var(--ink-2); font-size:15px; line-height:1;
}
.pick[aria-pressed="true"]{background:var(--route); border-color:var(--route); color:#fff}

/* segmented control */
.seg{display:flex; background:rgba(13,17,23,.06); border-radius:10px; padding:3px; gap:3px; margin-bottom:12px}
.seg button{
  flex:1; padding:8px 6px; font:inherit; font-size:13px; font-weight:560; cursor:pointer;
  background:transparent; border:0; border-radius:8px; color:var(--ink-2);
  display:flex; align-items:center; justify-content:center; gap:6px;
}
.seg button[aria-pressed="true"]{background:#fff; color:var(--ink); box-shadow:0 1px 3px rgba(13,17,23,.14)}
.seg .swatch{width:8px; height:8px; border-radius:50%}

.btn{
  width:100%; padding:11px; font:inherit; font-size:13.5px; font-weight:600; cursor:pointer;
  border-radius:10px; border:1px solid transparent; margin-bottom:8px;
}
.btn-primary{background:var(--route); color:#fff}
.btn-primary:hover{background:#1a5fd0}
.btn-ghost{background:rgba(255,255,255,.92); border-color:var(--line); color:var(--ink)}
.btn-ghost:hover{background:#fff}

/* route summary */
.summary{
  margin-top:13px; padding:13px; border-radius:12px;
  background:rgba(255,255,255,.92); border:1px solid var(--line);
}
.summary[hidden]{display:none}
.sum-top{display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin-bottom:10px}
.sum-dist{font-size:22px; font-weight:670; letter-spacing:-.02em; font-variant-numeric:tabular-nums}
.sum-tag{font-size:11px; font-weight:650; padding:3px 8px; border-radius:20px;
  background:rgba(31,111,235,.12); color:var(--route)}
.rows{display:grid; gap:7px}
.row{display:flex; justify-content:space-between; align-items:center; font-size:13px}
.row .k{color:var(--ink-2); display:flex; align-items:center; gap:7px}
.row .v{font-weight:620; font-variant-numeric:tabular-nums}
.row .dot{width:8px; height:8px; border-radius:50%; flex:none}
.hint{margin:10px 0 0; font-size:11.5px; line-height:1.5; color:var(--ink-3)}
.alt-note{margin-top:9px; padding-top:9px; border-top:1px dashed var(--line);
  font-size:12px; color:var(--ink-2); display:flex; justify-content:space-between}

/* layers */
.layers{margin-top:14px; padding-top:13px; border-top:1px solid rgba(13,17,23,.08)}
.chk{display:flex; align-items:center; gap:9px; padding:5px 0; font-size:13px; cursor:pointer}
.chk input{width:15px; height:15px; accent-color:var(--route); cursor:pointer}
.chk .tally{margin-left:auto; font-size:11.5px; color:var(--ink-3); font-variant-numeric:tabular-nums}

/* fleet strip */
.fleet{position:absolute; z-index:1000; left:16px; bottom:16px; display:flex; gap:8px; flex-wrap:wrap}
.chip{
  display:flex; align-items:center; gap:8px; padding:8px 13px; border-radius:11px;
  background:var(--glass); backdrop-filter:blur(14px) saturate(160%);
  -webkit-backdrop-filter:blur(14px) saturate(160%);
  border:1px solid var(--glass-edge); box-shadow:var(--shadow); font-size:12.5px;
}
.chip b{font-variant-numeric:tabular-nums; font-weight:670}
.chip .swatch{width:9px; height:9px; border-radius:50%}

/* ---------- map markers ---------- */
.veh{position:relative; width:34px; height:34px}
.veh .body{
  position:absolute; inset:0; border-radius:50%; display:grid; place-items:center;
  border:2.5px solid #fff; box-shadow:0 2px 7px rgba(13,17,23,.35);
  transition:transform .18s ease;
}
.veh.auto .body{background:var(--auto)}
.veh.buggy .body{background:var(--buggy)}
.veh .heading{
  position:absolute; left:50%; top:50%; width:0; height:0; margin:-25px 0 0 -5px;
  border-left:5px solid transparent; border-right:5px solid transparent;
  border-bottom:8px solid rgba(13,17,23,.55); transform-origin:5px 25px;
}
.veh.sel .body{transform:scale(1.18)}
.veh.sel::after{
  content:""; position:absolute; left:50%; top:50%; width:34px; height:34px;
  margin:-17px 0 0 -17px; border-radius:50%; border:2px solid var(--route);
  animation:pulse 1.5s ease-out infinite;
}
@keyframes pulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(2.6);opacity:0}}

.pin{width:26px; height:26px; border-radius:50%; display:grid; place-items:center;
  font-size:10px; font-weight:700; color:#fff; border:2px solid #fff;
  box-shadow:0 1px 5px rgba(13,17,23,.3)}
.pin.gate{background:#6f42c1}
.pin.academic{background:#1f6feb}
.pin.hostel{background:#5a6472}
.pin.facility{background:#0f8b8d}
.pin.star{background:#d13b3b; width:30px; height:30px; font-size:11px;
  box-shadow:0 0 0 4px rgba(209,59,59,.22), 0 1px 5px rgba(13,17,23,.3)}
.endpin{width:18px; height:18px; border-radius:50%; border:3px solid #fff;
  box-shadow:0 1px 5px rgba(13,17,23,.4)}
.endpin.o{background:var(--ok)} .endpin.d{background:var(--bad)}

/* animated route dash */
.route-anim{stroke-dasharray:14 9; animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-23}}

.leaflet-popup-content{margin:12px 14px; font-family:inherit; min-width:190px}
.leaflet-popup-content-wrapper{border-radius:12px}
.pop-h{display:flex; align-items:center; gap:8px; margin-bottom:9px}
.pop-h .swatch{width:10px; height:10px; border-radius:50%; flex:none}
.pop-h b{font-size:14px}
.pop-type{font-size:11px; color:var(--ink-3); display:block; margin-top:1px}
.pop-row{display:flex; justify-content:space-between; font-size:12.5px; padding:3px 0}
.pop-row span:first-child{color:var(--ink-2)}
.pop-row span:last-child{font-weight:620; font-variant-numeric:tabular-nums}
.badge{display:inline-block; padding:2px 8px; border-radius:20px; font-size:11px; font-weight:650}
.badge.available{background:rgba(18,161,80,.14); color:var(--ok)}
.badge.enroute{background:rgba(217,139,0,.16); color:var(--warn)}
.badge.full{background:rgba(209,59,59,.13); color:var(--bad)}
.bar{height:5px; border-radius:3px; background:rgba(13,17,23,.1); overflow:hidden; margin-top:4px}
.bar i{display:block; height:100%; border-radius:3px}

/* On a phone the panel becomes a bottom sheet: the map keeps the top half of
   the screen, and the controls sit under the thumb. */
@media (max-width:760px){
  .panel{left:8px; right:8px; width:auto; top:auto; bottom:8px; max-height:52%;
         border-radius:18px}
  .panel-head{padding:12px 16px 10px}
  .panel-body{padding:12px 16px 14px}
  .fleet{left:8px; right:8px; top:8px; bottom:auto; gap:6px}
  .chip{padding:6px 10px; font-size:11.5px}
  .leaflet-bottom.leaflet-right{bottom:calc(52% + 2px)}
}
</style>
</head>
<body>

<div id="map"></div>

<aside class="panel">
  <div class="panel-head">
    <div class="brand">
      <span class="brand-dot"></span>
      <div>
        <h1>IITB Transit</h1>
        <small>Live campus autos &amp; buggies · prototype</small>
      </div>
    </div>
  </div>

  <div class="panel-body">
    <label class="lbl" for="origin">Pickup</label>
    <div class="field">
      <select id="origin"></select>
      <button class="pick" id="pickO" type="button" aria-pressed="false"
              title="Pick pickup point on map">◎</button>
    </div>

    <label class="lbl" for="dest">Drop</label>
    <div class="field">
      <select id="dest"></select>
      <button class="pick" id="pickD" type="button" aria-pressed="false"
              title="Pick drop point on map">◎</button>
    </div>

    <label class="lbl">Ride mode</label>
    <div class="seg" role="group" aria-label="Ride mode">
      <button id="modeAuto"  type="button" aria-pressed="true">
        <span class="swatch" style="background:var(--auto)"></span>Auto</button>
      <button id="modeBuggy" type="button" aria-pressed="false">
        <span class="swatch" style="background:var(--buggy)"></span>Buggy</button>
    </div>

    <button class="btn btn-primary" id="findBtn" type="button">Find nearest vehicle</button>
    <button class="btn btn-ghost"  id="clearBtn" type="button">Clear route</button>

    <div class="summary" id="summary" hidden>
      <div class="sum-top">
        <span class="sum-dist" id="sumDist">—</span>
        <span class="sum-tag" id="sumTag">Optimised</span>
      </div>
      <div class="rows">
        <div class="row"><span class="k"><i class="dot" style="background:var(--ink-3)"></i>Walk</span>
          <span class="v" id="tWalk">—</span></div>
        <div class="row"><span class="k"><i class="dot" style="background:var(--auto)"></i>Auto ride</span>
          <span class="v" id="tAuto">—</span></div>
        <div class="row"><span class="k"><i class="dot" style="background:var(--buggy)"></i>Buggy ride</span>
          <span class="v" id="tBuggy">—</span></div>
        <div class="row"><span class="k"><i class="dot" style="background:var(--route)"></i>Door to door</span>
          <span class="v" id="tDoor">—</span></div>
      </div>
      <div class="alt-note" id="altNote" hidden>
        <span>Alternative route</span><span id="altDist">—</span>
      </div>
      <p class="hint" id="hint"></p>
    </div>

    <div class="layers">
      <label class="lbl">Map layers</label>
      <label class="chk"><input type="checkbox" id="lAutos" checked> Show autos
        <span class="tally" id="nAutos">0</span></label>
      <label class="chk"><input type="checkbox" id="lBuggies" checked> Show buggies
        <span class="tally" id="nBuggies">0</span></label>
      <label class="chk"><input type="checkbox" id="lHostels" checked> Show hostels
        <span class="tally" id="nHostels">0</span></label>
      <label class="chk"><input type="checkbox" id="lAcademic" checked> Show academic zone
        <span class="tally" id="nAcademic">0</span></label>
      <label class="chk"><input type="checkbox" id="lRoads"> Show road network</label>
    </div>
  </div>
</aside>

<div class="fleet">
  <div class="chip"><span class="swatch" style="background:var(--auto)"></span>
    Autos <b id="cAuto">0</b> live · <b id="cAutoFree">0</b> free</div>
  <div class="chip"><span class="swatch" style="background:var(--buggy)"></span>
    Buggies <b id="cBuggy">0</b> live · <b id="cBuggyFree">0</b> free</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"
        integrity="sha512-puJW3E/qXDqYp9IfhAI54BJEaWIfloJ7JWs7OeD5i6ruC9JZL1gERT1wjtwXFlh7CjE7ZJ+/vcRZRkIYIb6p4g=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
"use strict";
/* ===========================================================================
   IITB TRANSIT — live campus vehicle tracking prototype
   ---------------------------------------------------------------------------
   Sections:
     1. Campus data (landmarks + road network)   <-- edit coordinates here
     2. Geometry helpers
     3. Road graph + Dijkstra routing
     4. Map setup and landmark layers
     5. Vehicle fleet simulation
     6. Route planning UI
     7. Nearest-vehicle search
     8. Layer toggles + boot
   =========================================================================== */

/* ---------------------------------------------------------------------------

   mapped individually in OSM, so those two pins sit at the middle of the block
   they belong to. Everything below is data only - swap in your own numbers and
   nothing else has to change.
--------------------------------------------------------------------------- */
const CAMPUS_CENTER = [19.1334, 72.9133];
const CAMPUS_ZOOM   = 15;

const LANDMARKS = [
  // --- gates ---

const BY_ID = Object.fromEntries(LANDMARKS.map(l => [l.id, l]));
/** Coordinate pair for a landmark id. */

/* ---------------------------------------------------------------------------
   2. GEOMETRY HELPERS
--------------------------------------------------------------------------- */
const R_EARTH = 6371000;
const rad = d => d * Math.PI / 180;

/** Great-circle distance in metres. */
function haversine(a, b){
  const dLat = rad(b[0]-a[0]), dLng = rad(b[1]-a[1]);
  const s = Math.sin(dLat/2)**2 +
            Math.cos(rad(a[0]))*Math.cos(rad(b[0]))*Math.sin(dLng/2)**2;
  return 2 * R_EARTH * Math.asin(Math.min(1, Math.sqrt(s)));
}
/** Total length of a polyline, metres. */
const pathLength = pts => pts.reduce((m,p,i) => i ? m + haversine(pts[i-1],p) : 0, 0);
/** Linear interpolation between two coordinates. */
const lerp = (a,b,t) => [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t];
/** Compass bearing a -> b, degrees. */
function bearing(a,b){
  const y = Math.sin(rad(b[1]-a[1]))*Math.cos(rad(b[0]));
  const x = Math.cos(rad(a[0]))*Math.sin(rad(b[0])) -
            Math.sin(rad(a[0]))*Math.cos(rad(b[0]))*Math.cos(rad(b[1]-a[1]));
  return (Math.atan2(y,x)*180/Math.PI + 360) % 360;
}
const fmtKm  = m => m < 950 ? Math.round(m) + " m" : (m/1000).toFixed(2) + " km";
const fmtMin = m => m < 1 ? "<1 min" : Math.round(m) + " min";
/** Travel time in minutes for a distance in metres at a km/h speed. */
const minutesFor = (metres, kmh) => (metres/1000) / kmh * 60;

/* ---------------------------------------------------------------------------
   3. ROAD GRAPH + DIJKSTRA
   Nodes are de-duplicated by rounded coordinate, so roads that share a
   landmark automatically connect there.
--------------------------------------------------------------------------- */
const key = p => p[0].toFixed(5) + "," + p[1].toFixed(5);
const GRAPH = new Map();   // key -> { pt, edges: Map(key -> metres) }

function node(p){
  const k = key(p);
  if (!GRAPH.has(k)) GRAPH.set(k, { pt:[+p[0], +p[1]], edges:new Map() });
  return k;
}
function link(a, b){
  const ka = node(a), kb = node(b);
  if (ka === kb) return;
  const w = haversine(GRAPH.get(ka).pt, GRAPH.get(kb).pt);
  GRAPH.get(ka).edges.set(kb, w);
  GRAPH.get(kb).edges.set(ka, w);
}
ROADS.forEach(r => { for (let i = 1; i < r.pts.length; i++) link(r.pts[i-1], r.pts[i]); });

/** Graph node closest to an arbitrary coordinate. */
function nearestNode(pt){
  let best = null, bd = Infinity;
  for (const [k, n] of GRAPH){
    const d = haversine(pt, n.pt);
    if (d < bd){ bd = d; best = k; }
  }
  return best;
}

/**
 * Dijkstra over the road graph.
 * @param {string} src node key
 * @param {string} dst node key
 * @param {Set<string>} [penalise] undirected edge ids ("a|b" sorted) to weight up
 * @returns {{keys:string[], pts:number[][], dist:number}|null}
 */
function shortestPath(src, dst, penalise){
  const PENALTY = 3.2;
  const dist = new Map(), prev = new Map(), seen = new Set();
  for (const k of GRAPH.keys()) dist.set(k, Infinity);
  dist.set(src, 0);

  while (true){
    let u = null, ud = Infinity;
    for (const [k, d] of dist) if (!seen.has(k) && d < ud){ ud = d; u = k; }
    if (u === null || u === dst) break;
    seen.add(u);
    for (const [v, w] of GRAPH.get(u).edges){
      if (seen.has(v)) continue;
      const eid = u < v ? u + "|" + v : v + "|" + u;
      const cost = ud + w * (penalise && penalise.has(eid) ? PENALTY : 1);
      if (cost < dist.get(v)){ dist.set(v, cost); prev.set(v, u); }
    }
  }
  if (!isFinite(dist.get(dst))) return null;

  const keys = [];
  for (let k = dst; k !== undefined; k = prev.get(k)){
    keys.unshift(k);
    if (k === src) break;
  }
  if (keys[0] !== src) return null;
  const pts = keys.map(k => GRAPH.get(k).pt);
  return { keys, pts, dist: pathLength(pts) };
}

/** Undirected edge ids along a node path. */
function edgeIds(keys){
  const s = new Set();
  for (let i = 1; i < keys.length; i++){
    const a = keys[i-1], b = keys[i];
    s.add(a < b ? a + "|" + b : b + "|" + a);
  }
  return s;
}

/** Route through an ordered list of landmark ids (used for patrol loops). */
function routeThrough(ids){
  let pts = [];
  for (let i = 1; i < ids.length; i++){
    const r = shortestPath(nearestNode(P(ids[i-1])), nearestNode(P(ids[i])));
    if (!r) continue;
    pts = pts.length ? pts.concat(r.pts.slice(1)) : r.pts.slice();
  }
  return pts;
}

    cap, seats: 0,

  };
  v.seats = v.status === 'Full' ? cap
          : v.status === 'En Route' ? Math.max(1, Math.round(rnd(1, cap-1)))

/** Move a vehicle `metres` along its path, bouncing at either end. */
function advance(v, metres){
  let left = metres;
  let guard = 0;
  while (left > 0 && guard++ < 500){
    const a = v.path[v.seg], b = v.path[v.seg+1];
    const segLen = Math.max(0.5, haversine(a,b));
    const remain = v.dir > 0 ? (1 - v.t) * segLen : v.t * segLen;
    if (left < remain){
      v.t += v.dir * (left / segLen);
      left = 0;
    } else {
      left -= remain;
      if (v.dir > 0){
        v.seg++;
        v.t = 0;
        if (v.seg >= v.path.length - 1){ v.seg = v.path.length - 2; v.t = 1; v.dir = -1; }
      } else {
        v.seg--;
        v.t = 1;
        if (v.seg < 0){ v.seg = 0; v.t = 0; v.dir = 1; }
      }
    }
  }
  v.t = Math.min(1, Math.max(0, v.t));
  return lerp(v.path[v.seg], v.path[v.seg+1], v.t);
}

let selectedId = null;
let lastFrame = performance.now();

function animate(now){
  const dt = Math.min(0.25, (now - lastFrame)/1000);
  lastFrame = now;
  fleet.forEach(v => {
    const factor = v.status === 'Full' ? 0.85 : 1;
    const pos = advance(v, (v.speed*1000/3600) * dt * factor);
    v.marker.setLatLng(pos);
    const a = v.path[v.seg], b = v.path[v.seg+1];
    const hdg = v.dir > 0 ? bearing(a,b) : bearing(b,a);
    if (Math.abs((v._hdg ?? -999) - hdg) > 4 || v._sel !== (v.id === selectedId)){
      v._hdg = hdg; v._sel = (v.id === selectedId);
      v.marker.setIcon(vehicleIcon(v, hdg, v._sel));
    }
  });
  requestAnimationFrame(animate);
}

              : v.status === 'En Route' ? Math.max(1, Math.round(rnd(1, v.cap-1)))
              : Math.round(rnd(0, Math.max(0, v.cap-2)));
    }
    v.charge = Math.max(6, v.charge - rnd(0, 0.35));
    /* campus speed limit is 25 km/h, so autos drift inside 10-24 and buggies,
       which are slower by design, inside 6-16 */
    v.speed  = Math.min(v.type==='auto'?24:16,
               Math.max(v.type==='auto'?10:6, v.speed + rnd(-2.5, 2.5)));
    if (v.marker.isPopupOpen()) v.marker.setPopupContent(popupHTML(v));
  });
  updateCounts();
}

let mode = 'auto';
let endpoints = { o:null, d:null };     // {pt, label}
let endMarkers = { o:null, d:null };
let pickMode = null;                    // 'o' | 'd' | null

function setEndpoint(which, pt, label){
  endpoints[which] = { pt, label };
  if (endMarkers[which]) layers.markers.removeLayer(endMarkers[which]);
  endMarkers[which] = L.marker(pt, {
    icon: L.divIcon({ className:'',
      html:`<div class="endpin ${which}"></div>`,
      iconSize:[18,18], iconAnchor:[9,9] }),
    title:(which === 'o' ? 'Pickup: ' : 'Drop: ') + label
  }).addTo(layers.markers);
}

function currentEndpoints(){
  const o = els.origin.value, d = els.dest.value;
  if (o) setEndpoint('o', P(o), BY_ID[o].name);
  if (d) setEndpoint('d', P(d), BY_ID[d].name);
  return endpoints.o && endpoints.d ? endpoints : null;
}

function clearRoutes(){ layers.routes.clearLayers(); }

function drawRoute(){
  const ends = currentEndpoints();
  if (!ends){ els.summary.hidden = true; return; }
  clearRoutes();

  const src = nearestNode(ends.o.pt), dst = nearestNode(ends.d.pt);
  const primary = shortestPath(src, dst);
  if (!primary){ els.summary.hidden = true; return; }

  /* The two endpoints are rarely standing on the road itself, so the walk-in
     legs are part of the trip and are counted in every distance below. When
     both endpoints hang off the same road node the legs are the whole trip. */
  const legs = haversine(ends.o.pt, primary.pts[0]) +
               haversine(ends.d.pt, primary.pts.at(-1));
  const primaryDist = primary.dist + legs;

  /* alternative: penalise the primary edges and solve again */
  const alt = shortestPath(src, dst, edgeIds(primary.keys));
  const altDistTotal = alt ? alt.dist + legs : null;
  const altIsDistinct = alt && alt.pts.length > 1 &&
                        Math.abs(alt.dist - primary.dist) > 40;

  if (altIsDistinct){
    L.polyline(alt.pts, { color:'var(--route-alt)', weight:5, opacity:.65,
                          lineCap:'round', lineJoin:'round' })
     .bindTooltip('Alternative · ' + fmtKm(altDistTotal), { sticky:true })
     .addTo(layers.routes);
  }

  /* casing + animated primary line */
  if (primary.pts.length > 1){
    L.polyline(primary.pts, { color:'#fff', weight:10, opacity:.9,
                              lineCap:'round', lineJoin:'round' }).addTo(layers.routes);
    L.polyline(primary.pts, { color:'var(--route)', weight:6, opacity:.95,
                              lineCap:'round', lineJoin:'round',
                              className:'route-anim' })
     .bindTooltip('Optimised route · ' + fmtKm(primaryDist), { sticky:true })
     .addTo(layers.routes);
  }

  /* short connectors from the actual endpoints to the road network */
  [[ends.o.pt, primary.pts[0]], [ends.d.pt, primary.pts.at(-1)]].forEach(pair => {
    if (haversine(pair[0], pair[1]) > 8)
      L.polyline(pair, { color:'var(--route)', weight:3, opacity:.6, dashArray:'2 7' })
       .addTo(layers.routes);
  });

  /* leave room for whichever edge the panel is docked to */
  const narrow = window.innerWidth <= 760;
  map.fitBounds(L.latLngBounds([ends.o.pt, ...primary.pts, ends.d.pt]).pad(0.35),
                narrow ? { paddingTopLeft:[24, 70],
                           paddingBottomRight:[24, Math.round(window.innerHeight*0.5)],
                           maxZoom:17 }
                       : { paddingTopLeft:[360, 40], maxZoom:17 });
  showSummary(primaryDist, altIsDistinct ? altDistTotal : null);
}

function showSummary(dist, altDist){
  const walk  = minutesFor(dist, SPEED.walk);
  const auto  = minutesFor(dist, SPEED.auto);
  const buggy = minutesFor(dist, SPEED.buggy);
  const ride  = mode === 'auto' ? auto : buggy;

  els.summary.hidden = false;
  els.sumDist.textContent = fmtKm(dist);
  els.sumTag.textContent  = mode === 'auto' ? 'Auto · optimised' : 'Buggy · fixed route';
  els.tWalk.textContent   = fmtMin(walk);
  els.tAuto.textContent   = fmtMin(auto);
  els.tBuggy.textContent  = fmtMin(buggy);
  els.tDoor.textContent   = fmtMin(ride + TYPICAL_WAIT_MIN);

  els.altNote.hidden = altDist === null;
  if (altDist !== null) els.altDist.textContent = fmtKm(altDist) + " · " + fmtMin(minutesFor(altDist, SPEED[mode]));

  els.hint.textContent = walk <= ride + TYPICAL_WAIT_MIN
    ? `Walking is faster door to door once the ${TYPICAL_WAIT_MIN} min typical wait is counted.`
    : `Door to door includes the ${TYPICAL_WAIT_MIN} min average wait measured in the campus survey.`;
}

/* ---------------------------------------------------------------------------
   7. NEAREST VEHICLE
--------------------------------------------------------------------------- */
function findNearest(){
  const ends = currentEndpoints();
  const from = ends ? ends.o.pt : CAMPUS_CENTER;
  const pool = fleet.filter(v => v.type === mode && v.status === 'Available');
  if (!pool.length){
    els.summary.hidden = false;
    els.hint.textContent = `No ${mode === 'auto' ? 'auto' : 'buggy'} is free right now. `
                         + `Statuses refresh every few seconds — try again shortly.`;
    return;
  }
  let best = null, bd = Infinity;
  pool.forEach(v => {
    const d = haversine(from, [v.marker.getLatLng().lat, v.marker.getLatLng().lng]);
    if (d < bd){ bd = d; best = v; }
  });
  selectedId = best.id;
  fleet.forEach(v => { v._sel = null; });     // force icon refresh next frame
  map.panTo(best.marker.getLatLng(), { animate:true });
  best.marker.openPopup();

  els.summary.hidden = false;
  els.hint.textContent = `${best.id} is ${fmtKm(bd)} away, about `
    + `${fmtMin(minutesFor(bd, SPEED[mode]))} to reach you.`;
}

/* ---------------------------------------------------------------------------
   8. EVENTS, LAYER TOGGLES, BOOT
--------------------------------------------------------------------------- */
els.origin.addEventListener('change', drawRoute);
els.dest.addEventListener('change', drawRoute);

function setMode(m){
  mode = m;
  $('modeAuto').setAttribute('aria-pressed', String(m === 'auto'));
  $('modeBuggy').setAttribute('aria-pressed', String(m === 'buggy'));
  if (!els.summary.hidden) drawRoute();
}
$('modeAuto').addEventListener('click',  () => setMode('auto'));
$('modeBuggy').addEventListener('click', () => setMode('buggy'));
$('findBtn').addEventListener('click', findNearest);
$('clearBtn').addEventListener('click', () => {
  clearRoutes(); layers.markers.clearLayers();
  endpoints = { o:null, d:null }; endMarkers = { o:null, d:null };
  els.origin.value = ''; els.dest.value = '';
  els.summary.hidden = true; selectedId = null;
  fleet.forEach(v => { v._sel = null; });
});

/* click-to-pick on the map */
function armPick(which, btn){
  pickMode = pickMode === which ? null : which;
  $('pickO').setAttribute('aria-pressed', String(pickMode === 'o'));
  $('pickD').setAttribute('aria-pressed', String(pickMode === 'd'));
  map.getContainer().style.cursor = pickMode ? 'crosshair' : '';
}
$('pickO').addEventListener('click', () => armPick('o'));
$('pickD').addEventListener('click', () => armPick('d'));

map.on('click', e => {
  if (!pickMode) return;
  const pt = [e.latlng.lat, e.latlng.lng];
  const snapped = GRAPH.get(nearestNode(pt)).pt;
  setEndpoint(pickMode, snapped, `Custom point (${snapped[0].toFixed(4)}, ${snapped[1].toFixed(4)})`);
  (pickMode === 'o' ? els.origin : els.dest).value = '';
  armPick(null);
  if (endpoints.o && endpoints.d){
    /* drawRoute() re-reads the selects, so route directly from stored endpoints */
    const primary = shortestPath(nearestNode(endpoints.o.pt), nearestNode(endpoints.d.pt));
    if (primary){
      clearRoutes();
      const alt = shortestPath(nearestNode(endpoints.o.pt), nearestNode(endpoints.d.pt),
                               edgeIds(primary.keys));
      const distinct = alt && Math.abs(alt.dist - primary.dist) > 40;
      if (distinct) L.polyline(alt.pts, { color:'var(--route-alt)', weight:5, opacity:.65 })
                     .addTo(layers.routes);
      L.polyline(primary.pts, { color:'#fff', weight:10, opacity:.9 }).addTo(layers.routes);
      L.polyline(primary.pts, { color:'var(--route)', weight:6, className:'route-anim' })
       .addTo(layers.routes);
      showSummary(primary.dist, distinct ? alt.dist : null);
    }
  }
});

/* layer checkboxes */
const toggle = (box, layer) => {
  box.addEventListener('change', () => {
    if (box.checked) map.addLayer(layer); else map.removeLayer(layer);
  });
};
toggle($('lAutos'),    layers.autos);
toggle($('lBuggies'),  layers.buggies);
toggle($('lHostels'),  layers.hostels);
toggle($('lAcademic'), layers.academic);
toggle($('lRoads'),    layers.roads);

/* build the fleet: 7 autos + 4 buggies = 11 active vehicles */
for (let i = 0; i < 7; i++){ const v = makeVehicle('auto', i);  if (v) fleet.push(v); }
for (let i = 0; i < 4; i++){ const v = makeVehicle('buggy', i); if (v) fleet.push(v); }

$('nHostels').textContent  = LANDMARKS.filter(l => l.cat === 'hostel').length;
$('nAcademic').textContent = LANDMARKS.filter(l => l.cat === 'academic').length;
updateCounts();
setInterval(telemetryTick, 2500);
requestAnimationFrame(animate);
drawRoute();

console.log(`IITB Transit ready — ${GRAPH.size} road nodes, ${fleet.length} vehicles.`);
</script>
